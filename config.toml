# Settings for panarctic.jl.
#
# Run with:  julia +1.13 --project=. panarctic.jl [config file]
# Without a config file argument, panarctic.jl reads this file. For your own settings, copy this file
# (e.g. to config_myname.toml) and pass it on the command line.
#
# Download credentials are NOT set here; they stay in environment variables (see README).

architecture = "GPU"   # "GPU" or "CPU"

[grid]
spacing_km = 15     # largest horizontal grid spacing [km] (at the pole; ~15% finer near the Atlantic edge)
Nz         = 20     # vertical levels
depth      = 5000   # maximum depth (m)

[time]
start_date = 1993-01-01   # initial condition (GLORYS); the run starts at noon on this date
end_date   = 1993-01-06   # the run ends at noon on this date; for short tests a date and time, e.g. 1993-01-01T15:00
dt_minutes = 10           # time step

[atmosphere]
jra55 = "multi_year"   # "multi_year": JRA55 for the run's own dates; "repeat_year": the 1990–91 repeat year

[output]
average_hours   = 24      # time-averaged output (3D ocean, free surface, sea ice), written to output_dir

[paths]
data_dir   = ""   # where downloads are stored; "" = each dataset's default cache
output_dir = "."  # where output (.jld2) and figures/movies from the plotting/ scripts are written

[boundaries]
velocity_inflow_days      = 1    # oblique radiation on u, v: nudging timescale toward GLORYS on inflow
tracer_inflow_km_atlantic = 20   # T, S reservoir inflow relaxation length; Atlantic side
tracer_inflow_km_pacific  = 20   # T, S reservoir inflow relaxation length; Pacific side
sponge = false                # GLORYS restoring in a rim along the open edges; keep off in normal use, potentially useful for debugging

