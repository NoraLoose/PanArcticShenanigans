# Settings shared by every run for the regional diagnostics (validation_config.jl), so that all runs are computed alike
# and can be compared. The run's own settings are in its config file.

[regional_diagnostics]
# Heat, salt and freshwater content and mean T, S profiles of the regions of regions.jl (regional_diagnostics.jl).
region_sets           = ["PAN", "TSAR"]   # PAN: 15 sub-basins covering the domain; TSAR: the 4 boxes of the observed
                                          # profiles of Muilwijk et al. (2022)
reference_temperature = 0      # heat content relative to this temperature (°C)
reference_salinity    = 34.8   # freshwater content relative to this salinity (g/kg), also the isohaline that bounds it
depth_bounds          = [100, 200, 300, 500, 700, 1000, 2000]   # content from the surface down to each depth (m); the
                                                                # whole water column is added
